[package]
name = "salamander-rs"
version = "0.6.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Dual-pane file manager for Ubuntu, inspired by Open Salamander"
authors = ["Salamander RS contributors"]

[workspace]
members = [".", "salamander-core", "salamander-tui", "salamander-launcher", "salamander-web"]
default-members = ["salamander-core", "salamander-tui", "salamander-launcher"]
resolver = "2"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
salamander-core = { path = "salamander-core" }
async-channel = "2"
trash = "5"
chrono = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
depends = "$auto, openssh-client"
section = "utils"
priority = "optional"
assets = [
    ["target/release/salamander-rs", "usr/bin/", "755"],
    ["target/release/salamander", "usr/bin/", "755"],
    ["target/release/salamander-rs-tui", "usr/bin/", "755"],
    ["assets/cz.k4.salamander-rs.desktop", "usr/share/applications/", "644"],
    ["assets/salamander-rs.svg", "usr/share/icons/hicolor/scalable/apps/salamander-rs.svg", "644"],
]
