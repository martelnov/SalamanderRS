[package]
name = "salamander-tui"
version = "0.6.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "SSH and Linux console interface for Salamander RS"

[[bin]]
name = "salamander-rs-tui"
path = "src/main.rs"

[dependencies]
salamander-core = { path = "../salamander-core" }
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
async-channel = "2"
