[package]
name = "salamander-web"
version = "0.10.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Browser-based dual-pane interface for Salamander RS"

[[bin]]
name = "salamander-rs-web"
path = "src/main.rs"

[dependencies]
salamander-core = { path = "../salamander-core" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
base64 = "0.22"
flate2 = "1"
async-channel = "2"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile = "3"
